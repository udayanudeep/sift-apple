name: Sift
options:
  bundleIdPrefix: com.sift
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sift-macOS:
    type: application
    platform: macOS
    sources: [Sources/Shared, Sources/Mac]
    settings:
      base:
        PRODUCT_NAME: Sift
        PRODUCT_BUNDLE_IDENTIFIER: com.sift.mac
        CODE_SIGNING_ALLOWED: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_CFBundleDisplayName: Sift
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Sift scans your Desktop for duplicate photos and videos.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Sift scans Documents for duplicate photos and videos.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Sift scans Downloads for duplicate photos and videos.
  Sift-iOS:
    type: application
    platform: iOS
    sources: [Sources/Shared, Sources/iOS]
    settings:
      base:
        PRODUCT_NAME: Sift
        PRODUCT_BUNDLE_IDENTIFIER: com.sift.ios
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Sift
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Sift reads your library on this device to find duplicate photos and videos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Sift removes duplicates you select.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
